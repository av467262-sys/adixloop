<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Adixloop PRO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.app{
    width:100%;
    height:100vh;
    max-width:520px;
    margin:auto;
    position:relative;
    background:#000;
}

.feed{
    width:100%;
    height:100%;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
}

.post{
    width:100%;
    height:100vh;
    min-height:100vh;
    position:relative;
    scroll-snap-align:start;
    overflow:hidden;
    background:#111;
}

.media{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#222;
}

.shade{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.45),
            transparent 35%,
            transparent 55%,
            rgba(0,0,0,.82)
        );
    pointer-events:none;
}

/* TOP */
.logo{
    position:absolute;
    top:28px;
    left:0;
    right:0;
    text-align:center;
    z-index:5;
    font-size:28px;
    font-weight:800;
}

.pro{
    display:inline-block;
    margin-left:6px;
    padding:4px 7px;
    border-radius:6px;
    background:#fff;
    color:#000;
    font-size:13px;
    vertical-align:middle;
}

/* RIGHT ACTIONS */
.actions{
    position:absolute;
    right:12px;
    bottom:105px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
}

.action{
    border:0;
    width:58px;
    min-height:58px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(5px);
}

.icon{
    font-size:29px;
    line-height:30px;
}

.count{
    font-size:14px;
    margin-top:3px;
}

.action:active{
    transform:scale(.92);
}

/* BOTTOM INFO */
.info{
    position:absolute;
    left:18px;
    right:90px;
    bottom:24px;
    z-index:8;
}

.username{
    font-size:20px;
    font-weight:800;
    margin-bottom:12px;
}

.caption{
    font-size:17px;
    line-height:1.45;
}

.meta{
    margin-top:7px;
    font-size:14px;
    opacity:.8;
}

/* TOAST */
.toast{
    position:absolute;
    left:50%;
    bottom:45%;
    transform:translate(-50%,-50%);
    z-index:100;
    background:rgba(20,20,20,.92);
    padding:12px 18px;
    border-radius:25px;
    font-size:15px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
}

/* MOBILE */
@media(max-width:520px){
    .post{
        height:100vh;
    }
}
</style>
</head>

<body>

<div class="app">

    <main class="feed">

        <section class="post">

            <video
                class="media"
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

            <div class="shade"></div>

            <div class="logo">
                Adixloop <span class="pro">PRO</span>
            </div>

            <div class="actions">

                <button class="action" onclick="toggleLike()">
                    <span class="icon" id="likeIcon">♡</span>
                    <span class="count" id="likeCount">0</span>
                </button>

                <button class="action" onclick="openComment()">
                    <span class="icon">💬</span>
                    <span class="count" id="commentCount">0</span>
                </button>

                <button class="action" onclick="sharePost()">
                    <span class="icon">↗</span>
                    <span class="count">Share</span>
                </button>

                <button class="action" onclick="toggleSave()">
                    <span class="icon" id="saveIcon">🔖</span>
                    <span class="count" id="saveText">Save</span>
                </button>

            </div>

            <div class="info">
                <div class="username">@adixloop</div>

                <div class="caption">
                    Welcome to Adixloop 🚀<br>
                    Create • Share • Discover
                </div>

                <div class="meta">
                    Frontend Demo
                </div>
            </div>

        </section>

    </main>

    <div class="toast" id="toast"></div>

</div>

<script>

/* =========================
   LOCAL DEMO STATE
========================= */

let liked = false;
let saved = false;
let likes = 0;
let comments = 0;


/* =========================
   LIKE
========================= */

function toggleLike(){

    liked = !liked;

    if(liked){
        likes = 1;
        document.getElementById("likeIcon").textContent = "♥";
    }else{
        likes = 0;
        document.getElementById("likeIcon").textContent = "♡";
    }

    document.getElementById("likeCount").textContent = likes;

    showToast(liked ? "Liked ❤️" : "Like removed");

}


/* =========================
   COMMENT
========================= */

function openComment(){

    const text = prompt("Write your comment:");

    if(text && text.trim()){

        comments++;

        document.getElementById("commentCount").textContent = comments;

        showToast("Comment added 💬");

    }

}


/* =========================
   SHARE
========================= */

async function sharePost(){

    const shareData = {
        title:"Adixloop PRO",
        text:"Check this post on Adixloop!",
        url:window.location.href
    };

    try{

        if(navigator.share){

            await navigator.share(shareData);

        }else{

            await navigator.clipboard.writeText(window.location.href);

            showToast("Link copied 🔗");

        }

    }catch(error){

        console.log("Share cancelled");

    }

}


/* =========================
   SAVE
========================= */

function toggleSave(){

    saved = !saved;

    const icon = document.getElementById("saveIcon");
    const text = document.getElementById("saveText");

    if(saved){

        icon.textContent = "🔖";
        text.textContent = "Saved";

        showToast("Post saved 🔖");

    }else{

        icon.textContent = "🔖";
        text.textContent = "Save";

        showToast("Removed from saves");

    }

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(function(){

        toast.classList.remove("show");

    },1800);

}

</script>

</body>
</html>
